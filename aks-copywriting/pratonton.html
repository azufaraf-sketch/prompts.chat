<title>Draf Mesej AKS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&display=swap">
<style>
/* Layout: one narrow phone-width column of chat bubbles, each with a copy button */
:root{
  --bg:#efe7dc; --chat:#e6ddd0; --bubble:#dcf3c8; --fg:#1d2a1f; --muted:#5d6b5f;
  --accent:#1f7a4a; --accent-fg:#ffffff; --line:#cfc4b4;
  --font:"Noto Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1712; --chat:#121c16; --bubble:#1f4a33; --fg:#e9efe9; --muted:#9fb0a4;
  --accent:#3fbf7a; --accent-fg:#06140b; --line:#2a3a30; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1712; --chat:#121c16; --bubble:#1f4a33; --fg:#e9efe9; --muted:#9fb0a4;
  --accent:#3fbf7a; --accent-fg:#06140b; --line:#2a3a30; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--font);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
header h1{font-size:1.15rem;margin:0 0 4px}
header p{margin:0;color:var(--muted);font-size:.9rem;line-height:1.45}
.card{display:flex;flex-direction:column;gap:10px}
.group{font-size:1rem;margin:14px 0 -6px;padding-top:12px;border-top:1px solid var(--line)}
.label{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.chat{background:var(--chat);border:1px solid var(--line);border-radius:14px;padding:14px 12px;display:flex;justify-content:flex-end}
.bubble{background:var(--bubble);color:var(--fg);border-radius:10px 2px 10px 10px;padding:9px 11px 6px;
  max-width:92%;min-width:0;font-size:15.5px;line-height:1.38;white-space:pre-wrap;overflow-wrap:anywhere;
  box-shadow:0 1px 1px rgba(0,0,0,.12)}
.bubble strong{font-weight:700}
.time{display:block;text-align:right;font-size:11px;color:var(--muted);margin-top:2px}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
button{font:inherit;font-size:.92rem;font-weight:700;background:var(--accent);color:var(--accent-fg);border:0;border-radius:999px;padding:9px 16px;cursor:pointer}
button.alt{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
button:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.status{font-size:.85rem;color:var(--muted)}
textarea.fallback{width:100%;min-height:120px;font:inherit;font-size:.85rem}
</style>

<div class="wrap">
  <header>
    <h1>Draf Mesej AKS</h1>
    <p>Baca macam di WhatsApp. Bila dah setuju, tekan butang salin, terus tampal ke WhatsApp (bold dah siap).</p>
  </header>
  <main id="list" class="wrap" style="padding:0"></main>
</div>

<script>
const DRAFTS = [
{group:"Bilas Khamis pagi · bersama video Iftar & Yasin Isnin", label:"Bilas 1 · Doa & makluman", text:
`Selamat pagi Tn Haji… 🥹

Ni video anak-anak yatim & asnaf berbuka puasa sunat Isnin lepas, sebelum tu depa baca Yasin sama-sama.

*Hari ni depa berpuasa sunat Khamis pula.* Invois barang dapur yang saya kongsi semalam tu untuk juadah berbuka depa petang ni ya Tn Haji.

*Doakanlah urusan kami dipermudahkan.* 🤲

*Moga Allah lapangkan urusan Tn Haji hari ni dan jauhkan Tn Haji sekeluarga dari segala sakit.* Aamiin.`},
{label:"Bilas 2 · Minta tak meminta", text:
`Subhanallah Tuan… 😢

Sejuk hati tengok anak-anak ni baca Yasin, lepas tu duduk berbuka sama-sama hari Isnin lepas. Saya kirim videonya ya Tuan.

*Petang ni depa berbuka puasa sunat Khamis.* Barang dapur dalam invois semalam tu masih kami usahakan.

Itulah Tuan, sekadar mengingatkan… *kalau ada kelapangan, bolehlah bantu melalui produk Asrama ataupun sumbangan ikhlas.*

*Moga anak cucu Tuan membesar jadi penyejuk mata, sebagaimana Tuan menyejukkan hati anak-anak yatim ni.* Aamiin 🤲`},
{label:"Bilas 3 · Masih sempat (hard sell lembut)", text:
`Tn Haji… 🥹

Video ni suasana anak-anak yatim & asnaf berbuka Isnin lepas, *selepas bacaan Yasin.*

*Petang ni depa berbuka lagi, puasa sunat Khamis.* Juadahnya dari invois RM992 yang saya kongsi semalam.

*Kalau Tn Haji nak sama-sama jamu depa hari ni, masih sempat ya Tn Haji,* melalui *produk Asrama ataupun sumbangan ikhlas,* hasilnya untuk tujuan kebajikan.

*Ya Allah, peliharalah Tn Haji sekeluarga dan berkatilah setiap rezeki yang Engkau titipkan.* Aamiin 🤲`},
{group:"Iftar Khamis · Invois RM992 (dah guna semalam)", label:"Versi 1 · Soft sell", text:
`Assalamualaikum Tn Haji… 🥹

Esok Khamis, anak-anak yatim & asnaf kami berpuasa sunat. *Ni invois barang dapur yang kami order dari pembekal untuk juadah berbuka depa, semuanya RM992.*

Kalau Tn Haji sudi sama-sama jamu anak-anak, bolehlah melalui *pembelian produk Asrama ataupun sumbangan ikhlas,* hasilnya untuk tujuan kebajikan. Ikut kelapangan ya Tn Haji.

*BANK RAKYAT*
*ASRAMA KASIH SAYANG*
*1101701441*

*Moga Allah luaskan rezeki Tn Haji sekeluarga.* Aamiin 🤲`},
{label:"Versi 2 · Satu bahagian (hard sell lembut)", text:
`Allahuakbar Tuan… 😔

*Ni invois barang yang kami tempah dari pembekal untuk Iftar Khamis esok.* Sardin, kentang, bawang dan sup, jumlahnya *RM992.*

Sardin saja dah RM144 sekarton. *Kalau Tuan ambil satu bahagian pun, dah besar maknanya buat anak-anak.*

Melalui *produk Asrama ataupun sumbangan ikhlas,* hasilnya untuk tujuan kebajikan.

*BANK RAKYAT*
*ASRAMA KASIH SAYANG*
*1101701441*

*Ya Allah, kenyangkanlah Tuan sekeluarga dengan nikmat syurga-Mu.* Aamiin 🤲🥹`},
{label:"Versi 3 · Minta tak meminta", text:
`Tn Haji… 🥹

Sekadar berkongsi, *ni invois barang dapur yang kami order dari pembekal* untuk anak-anak berbuka puasa sunat Khamis esok, *RM992 semuanya.*

Kalau ada rezeki lebih, bolehlah bantu melalui *produk Asrama ataupun sumbangan ikhlas.* Kalau belum ada pun tak apa, doa Tn Haji pun dah cukup bermakna.

*BANK RAKYAT*
*ASRAMA KASIH SAYANG*
*1101701441*

*Moga Allah sihatkan dan tenangkan hati Tn Haji sekeluarga.* Aamiin 🤲`}
];

function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function waToHtml(s){return esc(s).replace(/\*([^*\n]+)\*/g,"<strong>$1</strong>")}

const list=document.getElementById("list");
DRAFTS.forEach((d,i)=>{
  if(d.group){const h=document.createElement("h2");h.className="group";h.textContent=d.group;list.appendChild(h)}
  const card=document.createElement("section");card.className="card";
  card.innerHTML=`<div class="label">${esc(d.label)}</div>
  <div class="chat"><div class="bubble">${waToHtml(d.text)}<span class="time">${d.text.length} aksara</span></div></div>
  <div class="actions"><button id="copy-${i}" type="button" data-mode="wa">Salin untuk WhatsApp</button><button id="copytg-${i}" type="button" data-mode="tg" class="alt">Salin untuk Group Telegram</button><span class="status" id="st-${i}"></span></div>`;
  list.appendChild(card);
  card.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{
    const st=card.querySelector(".status");
    const tg=b.dataset.mode==="tg";
    const out=tg?"```\n"+d.text+"\n```":d.text;
    navigator.clipboard.writeText(out).then(()=>{st.textContent=tg?"Dah disalin. Tampal di Telegram, bintang akan kekal dalam kotak kod.":"Dah disalin. Tampal di WhatsApp."})
    .catch(()=>{
      let ta=card.querySelector("textarea");
      if(!ta){ta=document.createElement("textarea");ta.className="fallback";ta.readOnly=true;card.appendChild(ta)}
      ta.value=out;ta.focus();ta.select();st.textContent="Tekan lama pada kotak di bawah, pilih Salin.";
    });
  }));
});
</script>
