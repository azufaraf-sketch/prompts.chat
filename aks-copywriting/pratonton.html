<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&display=swap">
<style>
/* Layout: one narrow phone-width column of chat bubbles, each with a copy button */
:root{
  --bg:#efe7dc; --chat:#e6ddd0; --bubble:#dcf3c8; --fg:#1d2a1f; --muted:#5d6b5f;
  --accent:#1f7a4a; --accent-fg:#ffffff; --line:#cfc4b4;
  --font:"Noto Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1712; --chat:#121c16; --bubble:#1f4a33; --fg:#e9efe9; --muted:#9fb0a4;
  --accent:#3fbf7a; --accent-fg:#06140b; --line:#2a3a30; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1712; --chat:#121c16; --bubble:#1f4a33; --fg:#e9efe9; --muted:#9fb0a4;
  --accent:#3fbf7a; --accent-fg:#06140b; --line:#2a3a30; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--font);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
header h1{font-size:1.15rem;margin:0 0 4px}
header p{margin:0;color:var(--muted);font-size:.9rem;line-height:1.45}
.card{display:flex;flex-direction:column;gap:10px}
.group{font-size:1rem;margin:14px 0 -6px;padding-top:12px;border-top:1px solid var(--line)}
.label{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.chat{background:var(--chat);border:1px solid var(--line);border-radius:14px;padding:14px 12px;display:flex;justify-content:flex-end}
.bubble{background:var(--bubble);color:var(--fg);border-radius:10px 2px 10px 10px;padding:9px 11px 6px;
  max-width:92%;min-width:0;font-size:15.5px;line-height:1.38;white-space:pre-wrap;overflow-wrap:anywhere;
  box-shadow:0 1px 1px rgba(0,0,0,.12)}
.bubble strong{font-weight:700}
.time{display:block;text-align:right;font-size:11px;color:var(--muted);margin-top:2px}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
button{font:inherit;font-size:.92rem;font-weight:700;background:var(--accent);color:var(--accent-fg);border:0;border-radius:999px;padding:9px 16px;cursor:pointer}
button.alt{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
button:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.status{font-size:.85rem;color:var(--muted)}
textarea.fallback{width:100%;min-height:120px;font:inherit;font-size:.85rem}
</style>

<div class="wrap">

function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function waToHtml(s){return esc(s).replace(/\*([^*\n]+)\*/g,"<strong>$1</strong>")}

const list=document.getElementById("list");
DRAFTS.forEach((d,i)=>{
  if(d.group){const h=document.createElement("h2");h.className="group";h.textContent=d.group;list.appendChild(h)}
  const card=document.createElement("section");card.className="card";
  card.innerHTML=`<div class="label">${esc(d.label)}</div>
  <div class="chat"><div class="bubble">${waToHtml(d.text)}<span class="time">${d.text.length} aksara</span></div></div>
  <div class="actions"><button id="copy-${i}" type="button" data-mode="wa">Salin untuk WhatsApp</button><button id="copytg-${i}" type="button" data-mode="tg" class="alt">Salin untuk Group Telegram</button><span class="status" id="st-${i}"></span></div>`;
  list.appendChild(card);
  card.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{
    const st=card.querySelector(".status");
    const tg=b.dataset.mode==="tg";
    const out=tg?"```\n"+d.text+"\n```":d.text;
    navigator.clipboard.writeText(out).then(()=>{st.textContent=tg?"Dah disalin. Tampal di Telegram, bintang akan kekal dalam kotak kod.":"Dah disalin. Tampal di WhatsApp."})
    .catch(()=>{
      let ta=card.querySelector("textarea");
      if(!ta){ta=document.createElement("textarea");ta.className="fallback";ta.readOnly=true;card.appendChild(ta)}
      ta.value=out;ta.focus();ta.select();st.textContent="Tekan lama pada kotak di bawah, pilih Salin.";
    });
  }));
});
</script>
